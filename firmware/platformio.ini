; ============================================================================
; HATCH — Firmware platformio.ini
; ============================================================================
; Multi-modal edge-AI sensor node for Aedes breeding-site detection.
; Target: Seeed XIAO ESP32-S3 (Sense variant) with onboard INMP441 microphone
; and ample PSRAM for TinyML inference.
;
; To build: `pio run`
; To upload (with device connected): `pio run -t upload`
; To monitor: `pio device monitor -b 115200`
; ============================================================================

[platformio]
default_envs = xiao_esp32s3
src_dir = src
include_dir = include
lib_dir = lib

[env:xiao_esp32s3]
platform = espressif32@^6.5.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Use the larger partition table to make room for the TinyML model + OTA slot
board_build.partitions = partitions_8MB.csv
board_build.psram_type = opi

; Compiler flags
build_flags =
    -D BOARD_HAS_PSRAM
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    ; Hatch-specific
    -D HATCH_FW_VERSION=\"0.1.0-pregrant\"
    -D HATCH_ENV_SAMPLE_PERIOD_S=300       ; 5 minutes
    -D HATCH_AUDIO_SAMPLE_RATE_HZ=16000
    -D HATCH_AUDIO_BUFFER_S=4
    -D HATCH_ACOUSTIC_CONF_THRESHOLD=0.78
    -D HATCH_TEMPORAL_VOTE_WINDOW=5
    -D HATCH_TEMPORAL_VOTE_MIN_AGREE=3
    -D HATCH_DEEP_SLEEP_WAKEUP_PIN=GPIO_NUM_4

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    https://github.com/sandeepmistry/arduino-LoRa.git
    https://github.com/edgeimpulse/inferencing-sdk-cpp.git
    ; The TinyML model is delivered as a separate static library generated
    ; by Edge Impulse Studio. See /ml/notebooks/03_model_training.ipynb for
    ; the export procedure; the resulting `hatch_acoustic_inferencing.zip`
    ; library is placed in /firmware/lib/ before building.

; Optional environment for headless CI / build-without-hardware
[env:native_test]
platform = native
test_framework = unity
build_flags =
    -D HATCH_NATIVE_BUILD
    -D HATCH_FW_VERSION=\"0.1.0-test\"
